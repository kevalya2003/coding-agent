[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-coding-agent"
version = "0.1.0"
description = "A budgeted, test-gated coding agent with reproducible evaluation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "openai>=1.30,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<8.4",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

